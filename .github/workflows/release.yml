name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  linux-appimage:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            project_version="$(sed -n 's/^project(InstrumentHub VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
            ui_version="$(node -p "require('./ui/package.json').version")"
            if [[ "$version" != "$project_version" || "$version" != "$ui_version" ]]; then
              echo "error: tag ${GITHUB_REF_NAME} does not match CMake ${project_version} and UI ${ui_version}" >&2
              exit 1
            fi
          else
            version="$(sed -n 's/^project(InstrumentHub VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          fi
          version="$(printf '%s' "$version" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [[ -z "$version" ]]; then
            echo "error: could not determine a package version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build React UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Configure (Release)
        run: cmake --preset release

      - name: Build (Release)
        run: cmake --build --preset release --parallel --target instrument-hub ihub-scanner ihub-sandbox

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-appimage.sh "$VERSION" dist

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: instrument-hub-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: linux-appimage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: instrument-hub-linux-appimage
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Instrument Hub ${{ github.ref_name }}
          body: |
            Instrument Hub ${{ needs.linux-appimage.outputs.version }} for Linux x86_64.

            Download the AppImage, make it executable, and run it:

                chmod +x Instrument-Hub-${{ needs.linux-appimage.outputs.version }}-x86_64.AppImage
                ./Instrument-Hub-${{ needs.linux-appimage.outputs.version }}-x86_64.AppImage

            See [CHANGELOG.md](https://github.com/MatijaKocevar/instrument-hub/blob/${{ github.ref_name }}/CHANGELOG.md)
            for the curated list of changes.

            The AppImage is unsigned. It requires WebKitGTK 4.1 and a
            glibc-based distribution with glibc 2.39 or newer (Ubuntu 24.04
            or later is the verified baseline). Verify the download with
            SHA256SUMS before running it.

            Windows and macOS packages are not part of this release.
          files: |
            dist/*.AppImage
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
