name: build

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Check JUCE submodule
        run: |
          if [[ ! -f third_party/JUCE/CMakeLists.txt ]]; then
            echo "error: third_party/JUCE is missing; run: git submodule update --init --recursive" >&2
            exit 1
          fi

      - name: Build React UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run format:check
          pnpm run build

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel --target instrument-hub ihub-scanner ihub-sandbox
