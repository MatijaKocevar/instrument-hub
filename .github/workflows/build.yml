# Build Instrument Hub on Linux, Windows and macOS for every push.
#
# Scope (T004): compile only. No signing, no packaging, no release.
# The Linux job deliberately mirrors scripts/build.sh: verify the JUCE
# submodule, build the React UI, then configure and build the "default"
# CMake preset (RelWithDebInfo, Ninja).

name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same UI build artefacts the engine embeds (engine/CMakeLists.txt).
  NODE_VERSION: "20"

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Packages from third_party/JUCE/docs/Linux Dependencies.md.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      # --- scripts/build.sh, step by step ------------------------------------

      - name: Check JUCE submodule (scripts/build.sh)
        run: |
          if [[ ! -f third_party/JUCE/CMakeLists.txt ]]; then
            echo "error: third_party/JUCE is missing; run: git submodule update --init --recursive" >&2
            exit 1
          fi

      - name: Build React UI (scripts/build.sh build_ui)
        run: |
          if [[ ! -d ui/node_modules ]]; then
            if [[ -f ui/package-lock.json ]]; then
              npm --prefix ui ci
            else
              npm --prefix ui install
            fi
          fi
          npm --prefix ui run build

      - name: Configure (cmake --preset default)
        run: cmake --preset default

      - name: Build (cmake --build --preset default --parallel)
        run: cmake --build --preset default --parallel

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # engine/CMakeLists.txt uses NEEDS_WEBVIEW2, and JUCE's FindWebView2
      # only looks in the local NuGet package folder (it does not download).
      - name: Install WebView2 SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Register-PackageSource -Provider NuGet -Name nugetRepository `
            -Location https://www.nuget.org/api/v2 -Trusted -Force `
            -ErrorAction SilentlyContinue
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser `
            -RequiredVersion 1.0.3485.44 -Source nugetRepository -Force

      # Ninja needs cl.exe on PATH; the preset generator is Ninja.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build React UI
        run: |
          if [[ -f ui/package-lock.json ]]; then
            npm --prefix ui ci
          else
            npm --prefix ui install
          fi
          npm --prefix ui run build

      - name: Configure (cmake --preset default)
        run: cmake --preset default

      - name: Build (cmake --build --preset default --parallel)
        run: cmake --build --preset default --parallel

  macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build React UI
        run: |
          if [[ -f ui/package-lock.json ]]; then
            npm --prefix ui ci
          else
            npm --prefix ui install
          fi
          npm --prefix ui run build

      - name: Configure (cmake --preset default)
        run: cmake --preset default

      - name: Build (cmake --build --preset default --parallel)
        run: cmake --build --preset default --parallel
