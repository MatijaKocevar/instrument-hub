# The Launchpad has no encoders. These eight bindings describe the macros the
# UI exposes for the selected bank; the top row selects the page.
encoders:
  - encoder: 0
    macro: cutoff

  - encoder: 1
    macro: resonance

  - encoder: 2
    macro: reverb

  - encoder: 3
    macro: delay

  - encoder: 4
    macro: drive

  - encoder: 5
    macro: tone

  - encoder: 6
    macro: volume

  - encoder: 7
    macro: pan
