      - id: tambourine
        name: Tambourine
        kind: empty
        slot: 49
      - id: conga
        name: Conga
        kind: empty
        slot: 50
      - id: bongo
        name: Bongo
        kind: empty
        slot: 51
      - id: triangle
        name: Triangle
        kind: empty
