# Instrument Hub set mapping
#
# This file is hot-reloadable. Editing a pad's family/instrument line re-routes
# that pad to the instrument's audio slot within one watch interval (25 ms) and
# arms the new slot with the normal 3 ms equal-power crossfade. The audio
# stream is never stopped or rewired.
#
# Full contract: shared/schema/set.schema.json
#
# Layout:
#   families  eight instrument families, eight instruments each (64 patches)
#   macros    named destinations for the eight macro pages
#   banks     eight top-row macro pages (Launchpad CC 91..98)
#   scenes    eight right-column scenes (Launchpad CC 89..19, top to bottom)
#   pads      64 grid bindings: row N is family N, column N is patch N
#   encoders  eight macro bindings; the Launchpad exposes them as banks
#
# Each instrument is a patch descriptor. Families declare a default
# `colorIndex`; a patch may override it and also carries `volumeDb`, `pan`,
# `mute`, `solo`, its instrument/plugin descriptor and an ordered `fx` chain.
# Every patch here ships with `kind: empty`: it renders silence until a source
# (a VST3, a sampler kit or the built-in tone) is assigned to it. A plugin patch
# with no `pluginState` is cold: only its descriptor is stored until the patch
# has been loaded or edited.
#
# The Launchpad Mini MK3 grid is row-major from the bottom-left. Pad 0 is the
# bottom-left key (note 11) and pad 63 the top-right (note 88). Row 0 is Keys,
# row 7 is Vox; the right column selects the matching row through a scene.

schemaVersion: 1
name: Starter Set

families:
  keys:
    name: Keys
    colorIndex: 0
    instruments:
      - id: piano
        name: Grand Piano
        kind: empty
        slot: 0
        colorIndex: 1
        volumeDb: -2.5
        pan: -0.15
        fx:
          - id: eq
            name: Piano EQ
            kind: builtin
            parameters:
              low: 2.0
              high: -1.0
      - id: strings
        name: Warm Strings
        kind: empty
        slot: 1
      - id: rhodes
