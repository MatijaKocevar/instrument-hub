macros:
  cutoff:
    name: Cutoff
    parameter: filter.cutoff
    min: 0.0
    max: 1.0
    default: 0.75

  resonance:
    name: Resonance
    parameter: filter.resonance
    min: 0.0
    max: 1.0
    default: 0.2

  reverb:
    name: Reverb
    parameter: reverb.mix
    min: 0.0
    max: 1.0
    default: 0.25

  delay:
    name: Delay
    parameter: delay.mix
    min: 0.0
    max: 1.0
    default: 0.15

  drive:
    name: Drive
    parameter: amp.drive
    min: 0.0
    max: 1.0
    default: 0.0

  tone:
    name: Tone
    parameter: eq.tone
    min: -1.0
    max: 1.0
    default: 0.0

  volume:
    name: Volume
    parameter: mixer.volume
    min: 0.0
    max: 1.0
    default: 0.8

  pan:
    name: Pan
    parameter: mixer.pan
    min: -1.0
    max: 1.0
    default: 0.0

# Top-row CC 91..98 select these macro pages, left to right.
banks:
  - bank: 0
    name: Filter
    macros:
      - cutoff

  - bank: 1
    name: Resonance
    macros:
      - resonance

  - bank: 2
    name: Space
    macros:
      - reverb

  - bank: 3
    name: Delay
    macros:
      - delay

  - bank: 4
    name: Drive
    macros:
      - drive

  - bank: 5
    name: Tone
    macros:
      - tone

  - bank: 6
    name: Volume
    macros:
      - volume

  - bank: 7
    name: Pan
    macros:
      - pan

# Right-column CC 89..19 select these scenes, top to bottom. Scene 0 is the
# top grid row (Vox) and scene 7 the bottom row (Keys), so the button lines up
# with the row it names.
scenes:
  - scene: 0
    name: Vox
    family: vox

  - scene: 1
    name: Percussion
    family: perc

  - scene: 2
    name: FX
    family: fx

  - scene: 3
    name: Lead
    family: lead

  - scene: 4
    name: Pads
    family: pads

  - scene: 5
    name: Bass
    family: bass

  - scene: 6
    name: Drums
    family: drums

  - scene: 7
    name: Keys
    family: keys

# Row 0 (pads 0..7) is Keys, row 1 Drums, ... row 7 Vox. Pad index is also the
# audio slot the patch lives in.
pads:
  - pad: 0
    family: keys
    instrument: piano
  - pad: 1
    family: keys
    instrument: strings
  - pad: 2
