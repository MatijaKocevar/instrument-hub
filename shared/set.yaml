  vox:
    name: Vocals
    colorIndex: 7
    instruments:
      - id: ah
        name: Ahh Choir
        kind: empty
        slot: 56
        volumeDb: -3.0
        fx:
          - id: reverb
            name: Vocal Reverb
            kind: builtin
            parameters:
              mix: 0.4
      - id: oo
        name: Ooh Choir
        kind: empty
        slot: 57
      - id: eh
        name: Ehh Choir
        kind: empty
        slot: 58
      - id: whisper
        name: Whisper
        kind: empty
        slot: 59
      - id: shout
        name: Shout
        kind: empty
        slot: 60
