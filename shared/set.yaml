        kind: empty
        slot: 33
      - id: sine
        name: Sine Lead
        kind: empty
        slot: 34
      - id: supersaw
        name: Supersaw
        kind: empty
        slot: 35
      - id: pluck
        name: Pluck Lead
        kind: empty
        slot: 36
      - id: brass
