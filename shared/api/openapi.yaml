openapi: 3.1.0
info:
  title: Instrument Hub Control API
  version: 1.0.0
  description: |
    Local HTTP + WebSocket control surface for the Instrument Hub engine.

    The server binds `127.0.0.1:8080` by default. The React desktop UI and the
    tablet remote use the same endpoints; there is no second protocol layer.

    ### Authentication

    Authentication is disabled unless the engine was started with a pairing
    token. When enabled, every request (including the `/meters` upgrade) must
    carry either:

    - `X-Instrument-Hub-Token: <token>`, or
    - `Authorization: Bearer <token>`

    A missing or invalid token gets `401 Unauthorized` with a JSON body.

    ### Meters

    `/meters` is a WebSocket upgrade endpoint, not a normal JSON response. The
    server coalesces meter values and broadcasts one frame per tick
    (30 Hz by default, at least 10 Hz by contract). Slow clients skip frames
    instead of queuing them: `sequence` is monotonic and can have gaps.

    ### Live state

    `/events` is the state counterpart to `/meters`: every hardware pad press
    and every state mutation made through this API produces a frame carrying
    the complete `/state` document plus the event that caused it. Frames are
    coalesced per client and must reach a connected client within 100 ms.

servers:
  - url: http://127.0.0.1:8080
    description: Default loopback listener
  - url: http://localhost:8080
    description: Loopback listener via hostname

tags:
  - name: state
  - name: control
  - name: audio
  - name: plugins
  - name: meters
  - name: pairing

paths:
  /state:
    get:
      tags: [state]
      operationId: getState
      summary: Read the complete control state
      description: |
        Returns the current slot list, armed slot, settings and transport in
        one consistent snapshot. This is the UI's polling/reconnect endpoint.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /pages/{page}/restart:
    parameters:
      - name: page
        in: path
        required: true
        description: Plugin page id, for example `tracks`.
        schema:
          type: string
    post:
      tags: [control]
      operationId: restartPage
      summary: Restart a shared plugin page
      description: |
        Stops the shared plugin host for the page, restarts it, restores every
        slot's last committed plugin state, and re-arms the track that was
        active before the restart. The engine keeps running if the restart
        fails and reports the failure in the page status.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The page restarted and the complete state after recovery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "404":
          description: No plugin page with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The server has no audio session attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{index}:
    patch:
      tags: [state]
      operationId: renameTrack
      summary: Rename a performance track
      description: |
        Sets the display name for track `index` (0-7). The name is trimmed
        and must not be empty. The slot, family and patch display names follow
        the track so the instrument page shows the same label. Emits a `track`
        state event and is written to the project mapping on autosave.
      parameters:
        - name: index
          in: path
          required: true
          description: Track index, 0-7.
          schema:
            type: integer
            minimum: 0
            maximum: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackUpdate"
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The control state after the rename
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "400":
          description: The name is missing, empty or too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The track index is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tracks/{index}/select:
    post:
      tags: [state]
      operationId: selectTrack
      summary: Select and arm a performance track
      description: |
        Selects the track at `index` (0-7) and arms its slot. Exactly one
        track is selected at a time; the previous track fades out through the
        normal slot crossfade. Emits a `track` state event.

        Only available when `GET /state` reports `layout: tracks`.
      parameters:
        - name: index
          in: path
          required: true
          description: Track index, 0-7.
          schema:
            type: integer
            minimum: 0
            maximum: 7
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The control state after the selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "404":
          description: The track index is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tracks/{index}/fx/{hot}/toggle:
    post:
      tags: [state]
      operationId: toggleTrackFx
      summary: Toggle a track's hot FX insert
      description: |
        Toggles bypass on the insert assigned as hot FX `hot` (`0` or `1`)
        for track `index`. The insert is identified by the track's mapping
        hot-FX assignment, so an unassigned or missing insert is rejected.
        Emits a `track` state event.
      parameters:
        - name: index
          in: path
          required: true
          description: Track index, 0-7.
          schema:
            type: integer
            minimum: 0
            maximum: 7
        - name: hot
          in: path
          required: true
          description: Hot FX slot, 0 or 1.
          schema:
            type: integer
            minimum: 0
            maximum: 1
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The control state after the toggle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "400":
          description: The hot FX slot is unassigned or its insert is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The track or hot FX index is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tracks/{index}/fx/{hot}/assign:
    post:
      tags: [state]
      operationId: assignTrackFx
      summary: Assign a track's hot FX insert
      description: |
        Assigns `insertId` to hot FX `hot` (`0` or `1`) for track `index`.
        An empty string clears the slot. The insert must exist in the live
        chain; assigning an insert already used by the other hot slot moves
        it, so the two assignments stay distinct. Emits a `track` state event.
      parameters:
        - name: index
          in: path
          required: true
          description: Track index, 0-7.
          schema:
            type: integer
            minimum: 0
            maximum: 7
        - name: hot
          in: path
          required: true
          description: Hot FX slot, 0 or 1.
          schema:
            type: integer
            minimum: 0
            maximum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackFxAssignRequest"
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The control state after the assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "400":
          description: The insert id is missing from the live chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The track or hot FX index is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tracks/{index}/volume:
    post:
      tags: [state]
      operationId: setTrackVolume
      summary: Set a track's stepped volume
      description: |
        Sets the track volume step and applies the corresponding linear gain
        to the track slot. Emits a `track` state event.
      parameters:
        - name: index
          in: path
          required: true
          description: Track index, 0-7.
          schema:
            type: integer
            minimum: 0
            maximum: 7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackVolumeRequest"
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The control state after the volume change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "400":
          description: The step is missing or outside 0-4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The track index is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /project:
    get:
      tags: [state]
      operationId: getProject
      summary: Read the project lifecycle
      description: |
        Returns the running `.ihub` project's path, name and dirty state plus
        the recent project list from app settings.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current project and recent projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [state]
      operationId: updateProject
      summary: New, open, save, save-as or close a project
      description: |
        Every action writes through the project autosave path. `new` and
        `open` rebuild the session, so the grid, instruments and mixer follow
        the selected project. `close` flushes pending edits and detaches the
        autosave target without stopping audio.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCommand"
      responses:
        "200":
          description: The project lifecycle after the command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /arm:
    post:
      tags: [control]
      operationId: armSlot
      summary: Arm or disarm an audio slot
      description: |
        Arms one slot. The engine crossfades to it with the normal 3 ms
        equal-power ramp; arming the already armed slot is a no-op. Send
        `null` (or `-1`) to disarm every slot.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArmRequest"
            examples:
              armSlot3:
                value: { slot: 3 }
              disarm:
                value: { slot: null }
      responses:
        "200":
          description: The state after the arm request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /patches/{slot}:
    patch:
      tags: [control]
      operationId: updatePatch
      summary: Change one patch's mix or colour
      description: |
        Accepts a partial object for the patch hosted by `slot`. The provided
        fields are validated before anything is applied, so an invalid request
        never half-updates the patch. The instrument descriptor and the live
        warm/latency values are read-only here (they come from the set and the
        warm pool).

        `volumeDb`, `mute` and `solo` are resolved by the engine into the slot's
        effective gain, so the change is audible on the next block. A mute or a
        solo anywhere in the set updates every patch's effective gain. The
        response is the complete state after the change, and the same change is
        published as an `event.kind: "patch"` frame on `/events`.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      parameters:
        - name: slot
          in: path
          required: true
          description: Fixed audio-graph slot index, 0 .. 63.
          schema:
            type: integer
            minimum: 0
            maximum: 63
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUpdate"
            examples:
              quieter:
                value: { volumeDb: -12, colorIndex: 5 }
              mute:
                value: { mute: true }
      responses:
        "200":
          description: The state after the patch change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No patch is hosted by that slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /patches/{slot}/source:
    parameters:
      - name: slot
        in: path
        required: true
        description: Fixed audio-graph slot index, 0 .. 63.
        schema:
          type: integer
          minimum: 0
          maximum: 63
    post:
      tags: [control]
      operationId: changePatchSource
      summary: Change the instrument source behind one patch
      description: |
        Replaces the patch's instrument source: the built-in initialisation
        tone, a sampler kit, a hosted VST3 or the live audio input. The fixed
        graph is not rewired; the slot's proxy is re-bound to a freshly
        instantiated source and the previous instance is retired. An armed slot
        fades back in as soon as the new source is resident, so the change is
        audible on the next blocks. A cold slot keeps the new source in its warm
        request and instantiates it the next time it is armed.

        The patch identity (family, patch id, name, colour, mixer state and FX
        chain) is preserved. Every provided descriptor field is validated
        before the source is swapped, so a bad request never leaves the patch
        half-changed. The response is the complete state after the change, and
        the same change is published as `event.kind: "patch"` on `/events`.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchSourceRequest"
            examples:
              initTone:
                value: { kind: init-tone, name: Init Tone, frequency: 440 }
              sampler:
                value: { kind: sampler, name: Studio Kit, path: /home/user/kits/studio.ihubkit }
              plugin:
                value:
                  kind: plugin
                  name: TestPlugin
                  path: /usr/lib/vst3/TestPlugin.vst3
                  pluginId: com.instrumenthub.TestPlugin
                  pluginManufacturer: Instrument Hub
                  pluginVersion: 1.0.0
      responses:
        "200":
          description: The state after the source change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No patch is hosted by that slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /patches/{slot}/editor:
    parameters:
      - name: slot
        in: path
        required: true
        description: Fixed audio-graph slot index, 0 .. 63.
        schema:
          type: integer
          minimum: 0
          maximum: 63
    post:
      tags: [control]
      operationId: openPatchEditor
      summary: Open one patch's native plugin editor
      description: |
        Opens the native editor window of the plug-in hosted by the patch, or
        brings the existing window to the front. One window is kept per slot.

        The editor is never opened implicitly: selecting or arming a patch does
        not create one. The patch must host a plugin source whose instance is
        resident; a cold, sampler or generated source fails with a readable
        error. The patch's `editorOpen` flag is also updated in `/state`.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Whether the editor is open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchEditor"
        "400":
          description: The patch has no resident plugin or the editor failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No patch is hosted by that slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [control]
      operationId: closePatchEditor
      summary: Close one patch's native plugin editor
      description: |
        Closes the patch's native editor window if one is open. Idempotent: a
        slot with no window still answers with the current state. Switching or
        unloading the patch closes its editor before the processor is retired.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Whether the editor is open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchEditor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No patch is hosted by that slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /patches/{slot}/reload:
    parameters:
      - name: slot
        in: path
        required: true
        description: Fixed audio-graph slot index, 0 .. 63.
        schema:
          type: integer
          minimum: 0
          maximum: 63
    post:
      tags: [control]
      operationId: reloadPatch
      summary: Restart one patch's plugin instance from its committed state
      description: |
        Stops only this slot's plugin sandbox, waits for it to exit, then starts
        a fresh instance for the same slot and applies the last committed plugin
        state. A healthy instance is captured first; a failed or hung instance is
        never queried for state. Every other slot and its state is left untouched.

        The response is the complete state after the restart. A failed restart
        leaves a slot-local `error` on the patch and answers with the failure.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The state after the plugin restart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
        "400":
          description: The slot does not host a plugin or the restart failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No patch is hosted by that slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /patches/{slot}/state/capture:
    parameters:
      - name: slot
        in: path
        required: true
        description: Fixed audio-graph slot index, 0 .. 63.
        schema:
          type: integer
          minimum: 0
          maximum: 63
    post:
      tags: [control]
      operationId: capturePatchState
      summary: Save the running plugin's sound into its patch
      description: |
        Immediately captures the resident plug-in instance's state into the
        patch's opaque sidecar blob and answers with the stored size. Use it
        after tweaking a sound to keep it without switching away.

        Automatic captures on switch-away, editor close and warm-pool eviction
        remain unchanged. A generated, sampler or cold patch has no resident
        plug-in state and is rejected with a readable error.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The patch state that was captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchStateCapture"
        "400":
          description: The patch has no resident plugin instance or the capture failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No patch is hosted by that slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /patches/{slot}/fx:
    parameters:
      - name: slot
        in: path
        required: true
        description: Fixed audio-graph slot index, 0 .. 63.
        schema:
          type: integer
          minimum: 0
          maximum: 63
    get:
      tags: [control]
      operationId: getFxChain
      summary: Read one patch's insert chain
      description: |
        Returns the ordered inserts between the patch's instrument and the bus,
        plus the latency budget: the instrument's own latency, the summed
        latency of the inserts that are in the audible path, and the total in
        samples and milliseconds.

        Inserts are processed in list order. A bypassed insert (or one with
        `wet: 0`) contributes no latency.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The patch's insert chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxChain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No patch is hosted by that slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [control]
      operationId: addFxInsert
      summary: Append or insert an effect
      description: |
        Creates one insert and places it at `position` (clamped; omitted or -1
        appends). Built-in types are `eq`, `compressor`, `delay` and `reverb`;
        `vst3` loads a plugin bundle from `path`. The response is the complete
        chain after the change, and the same change is published as
        `event.kind: "patch"` on `/events`.

        Effect parameters are validated before anything is applied. See
        `FxInsert.parameters` for the built-in keys.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FxInsertRequest"
            examples:
              compressor:
                value:
                  type: compressor
                  position: 0
                  parameters: { thresholdDb: -30, ratio: 4 }
              vst3:
                value:
                  type: vst3
                  path: /usr/lib/vst3/Example.vst3
                  wet: 0.5
      responses:
        "200":
          description: The chain after the insert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxChain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No patch is hosted by that slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [control]
      operationId: replaceFxChain
      summary: Replace a patch's whole insert chain
      description: |
        Builds the complete chain from `chain` in one atomic operation. Each
        element is the same object `POST` accepts. An empty array clears the
        chain. If any element is invalid or a plugin cannot be loaded, the
        existing chain is left untouched.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FxChainReplace"
            examples:
              delayOnly:
                value:
                  chain:
                    - type: delay
                      wet: 0.35
                      parameters: { tempoSync: 1, division: 2 }
      responses:
        "200":
          description: The chain after the replacement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxChain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No patch is hosted by that slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /patches/{slot}/fx/{index}:
    parameters:
      - name: slot
        in: path
        required: true
        description: Fixed audio-graph slot index, 0 .. 63.
        schema:
          type: integer
          minimum: 0
          maximum: 63
      - name: index
        in: path
        required: true
        description: 0-based insert index in the current chain.
        schema:
          type: integer
          minimum: 0
    patch:
      tags: [control]
      operationId: updateFxInsert
      summary: Bypass, balance, re-parameterise or move one insert
      description: |
        Accepts a partial object: `bypassed`, `wet`, `parameters` and/or
        `position`. `position` moves the insert within the chain (0 is first).
        The response is the complete chain after the change.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FxInsertUpdate"
            examples:
              bypass:
                value: { bypassed: true }
              halfWet:
                value: { wet: 0.5 }
              moveFirst:
                value: { position: 0 }
      responses:
        "200":
          description: The chain after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxChain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The patch or insert index does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [control]
      operationId: removeFxInsert
      summary: Remove one insert
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The chain after the removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxChain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The patch or insert index does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /patches/{slot}/fx/reorder:
    parameters:
      - name: slot
        in: path
        required: true
        description: Fixed audio-graph slot index, 0 .. 63.
        schema:
          type: integer
          minimum: 0
          maximum: 63
    post:
      tags: [control]
      operationId: reorderFxChain
      summary: Reorder the inserts
      description: |
        `order` must be a permutation of the current insert indices;
        `order[0]` becomes the first insert. The response is the complete chain.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FxReorderRequest"
            examples:
              eqBeforeCompressor:
                value: { order: [1, 0] }
      responses:
        "200":
          description: The reordered chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxChain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No patch is hosted by that slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No audio session is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings:
    get:
      tags: [state]
      operationId: getSettings
      summary: Read the user settings
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [control]
      operationId: updateSettings
      summary: Update one or more settings
      description: |
        Accepts a partial JSON object. Every provided field is validated before
        anything is applied, so an invalid request never half-updates the
        settings. Unknown fields are rejected with `400`.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
            examples:
              changeMasterGain:
                value: { masterGain: 0.65 }
              enableMetronome:
                value: { metronome: true }
      responses:
        "200":
          description: Settings after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transport:
    get:
      tags: [state]
      operationId: getTransport
      summary: Read the transport state
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current transport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transport"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [control]
      operationId: controlTransport
      summary: Start, stop or reposition the transport
      description: |
        Accepts a partial JSON object. `bpm` is clamped by the engine to the
        documented range; `positionSamples` is an absolute sample position at
        the engine sample rate.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransportPatch"
            examples:
              startAt128:
                value: { playing: true, bpm: 128.0 }
              rewind:
                value: { ppq: 0.0, positionSamples: 0 }
      responses:
        "200":
          description: Transport after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audio:
    get:
      tags: [audio]
      operationId: getAudio
      summary: Read the audio device settings and live latency readout
      description: |
        Returns the open device (or the device the engine would open), the
        available device types/devices, sample rates and buffer sizes, the
        active channel mapping, the latency budget (one buffer + device latency
        + summed chain latency) and the xrun counters.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current audio settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioState"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [control]
      operationId: updateAudio
      summary: Change device, sample rate, buffer size or channel mapping
      description: |
        Accepts a partial object. Every field is validated before anything is
        applied. Changing the sample rate or buffer size on the open device
        hot-swaps it without restarting the application; changing a device
        field opens that device. The response is the state after the change,
        so the caller can reconcile the readout in one round trip.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioPatch"
            examples:
              bufferSize:
                value: { bufferSize: 256 }
              sampleRate:
                value: { sampleRate: 44100 }
              device:
                value: { deviceType: ALSA, deviceName: Loopback }
      responses:
        "200":
          description: Audio settings after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: No audio backend is attached (for example `--serve` without `--audio`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audio/measure:
    post:
      tags: [control]
      operationId: measureAudioLatency
      summary: Run the round-trip latency probe
      description: |
        Plays an impulse through the selected loopback, captures it and
        cross-correlates the two. Blocks for a few hundred milliseconds.
        `source=loopback` uses the internal ALSA Loopback; `source=device`
        uses the selected audio device and needs a physical output-to-input
        cable. A failed measurement is still `200`, with `valid: false` and
        `error` set, so the UI can show the reason next to the readout.
      parameters:
        - name: source
          in: query
          required: false
          description: Which loopback to measure.
          schema:
            type: string
            enum: [loopback, device]
            default: loopback
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Measurement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioMeasurement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: No audio backend is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audio/wizard:
    post:
      tags: [control]
      operationId: recommendAudioSetup
      summary: Probe the selected soundcard and recommend a stable low-latency setup
      description: |
        Opens the selected device at every available sample rate and at 64, 96 and
        128 frames, records xruns and the latency budget, then restores the
        original device. Blocks while it probes, so the audio drops out briefly.
        Applying the returned recommendation is a separate request.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Recommended setup and the measured tradeoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioWizard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: No audio backend or setup wizard is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audio/wizard/apply:
    post:
      tags: [control]
      operationId: applyAudioSetup
      summary: Apply and store the last recommended setup
      description: |
        Applies the recommendation returned by the most recent
        `POST /audio/wizard` and stores it as the profile for that soundcard.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Audio settings after the recommendation was applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: No audio backend or setup wizard is attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /meters:
    get:
      tags: [meters]
      operationId: metersWebSocket
      summary: Meter stream (WebSocket upgrade)
      description: |
        Upgrade to a WebSocket. The server immediately sends the latest frame,
        then one frame per broadcast tick (30 Hz by default, at least 10 Hz by
        contract). Frames are coalesced: slow clients skip sequence numbers
        rather than receiving a backlog.

        Frame shape (`application/json` text message):

        ```json
        {
          "type": "meters",
          "sequence": 42,
          "timestampMs": 1400.5,
          "master": { "peak": 0.31 },
          "slots": [
            { "slot": 0, "peak": 0.0, "gain": 0.0, "armed": false },
            { "slot": 1, "peak": 0.24, "gain": 1.0, "armed": true }
          ]
        }
        ```
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "101":
          description: WebSocket upgrade accepted; meter frames follow.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /events:
    get:
      tags: [state]
      operationId: stateEventsWebSocket
      summary: Live state stream (WebSocket upgrade)
      description: |
        Upgrade to a WebSocket. The server immediately sends the current
        state, then sends a new frame whenever:

        - a hardware pad is pressed or released (`event.kind: "pad"`),
        - `POST /arm` changes the armed slot (`"arm"`),
        - `POST /settings` or `POST /transport` succeeds,
        - a slot name, warm state or measured latency changes (`"slot"` / `"warm"`),
        - a track is selected, a hot FX toggles or the track volume changes
          (`"track"`),
        - `PATCH /patches/{slot}` changes a patch's volume, pan, mute, solo or
          colour (`"patch"`),
        - an audio device, MIDI input or pairing setting changes (`"device"`,
          `"midi"` or `"pairing"`),
        - an autosave finishes or fails (`"project"`).

        Frames are coalesced: a slow client skips sequence numbers instead of
        receiving a backlog. Each frame embeds the same document as
        `GET /state`, so a client never has to poll after an event. The
        `revision` field is monotonic and increases whenever the embedded
        document changes; a client applies only frames with a revision newer
        than the state it already holds. Latency from the physical pad press
        to the frame is under 100 ms.

        Frame shape (`application/json` text message):

        ```json
        {
          "type": "state",
          "sequence": 7,
          "revision": 8,
          "timestampMs": 1400.5,
          "event": { "kind": "pad", "pad": 3, "slot": -1, "pressed": true, "timestampMs": 1400.5 },
          "pads": [
            { "index": 0, "pressed": false, "updatedMs": 0.0 },
            { "index": 3, "pressed": true, "updatedMs": 1400.5 }
          ],
          "state": { "schemaVersion": 1, "revision": 8, "layout": "families", "armedSlot": -1, "slots": [], "settings": {}, "transport": {}, "uptimeMs": 1400.5 }
        }
        ```
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "101":
          description: WebSocket upgrade accepted; state frames follow.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /pairing:
    get:
      tags: [pairing]
      operationId: getPairing
      summary: Read LAN mode, the pairing code and the QR payload
      description: |
        Local management endpoint. It is only served to clients on the
        machine running the engine (loopback), so the live code is never
        exposed to the LAN. The desktop UI uses it to render the QR code.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current pairing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Pairing is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pairing/lan:
    post:
      tags: [pairing]
      operationId: setLanMode
      summary: Turn LAN mode on or off
      description: |
        Enabling LAN mode rebinds the control server from loopback to all
        interfaces, makes token authentication mandatory and issues a fresh
        six-digit pairing code. Disabling it returns to loopback-only,
        unauthenticated access and revokes every issued token.

        Loopback only. The rebind happens on a control thread, so the request
        that triggers it still receives its own response.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanRequest"
            examples:
              enable:
                value: { enabled: true }
              disable:
                value: { enabled: false }
      responses:
        "200":
          description: Pairing state after the toggle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Pairing is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pairing/revoke:
    post:
      tags: [pairing]
      operationId: revokePairingTokens
      summary: Forget every paired client
      description: |
        Revokes all pairing tokens. The desktop may call this when a tablet is
        lost or sold. Loopback only.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Pairing state after revocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Pairing is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pair:
    post:
      tags: [pairing]
      operationId: pair
      summary: Exchange a six-digit code for a token
      description: |
        Unauthenticated by necessity: this is how a new client gets its first
        token. The code is single-use and expires after five minutes; a
        successful exchange rotates it immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
            examples:
              pairTablet:
                value: { code: "123456", clientName: "Studio iPad" }
      responses:
        "200":
          description: A token that grants the control API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The code is wrong, expired or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: LAN mode is off, so there is nothing to pair with
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /plugins:
    get:
      tags: [plugins]
      operationId: listPlugins
      summary: List installed VST3 plug-ins
      description: |
        Returns the read-only inventory produced by the out-of-process scanner
        and its `PluginCache.xml`. An unchanged install is answered from the
        cache, so this endpoint never launches plugin code.

        `search` is a case-insensitive substring matched against name, vendor,
        version, category, format and path. The result is already filtered;
        `total` reports the unfiltered size. Rescanning is asynchronous: call
        `POST /plugins/rescan`, then poll this endpoint while `scanning` is
        true.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      parameters:
        - name: search
          in: query
          required: false
          description: Case-insensitive filter over the plug-in metadata.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Alias for `search`.
          schema:
            type: string
      responses:
        "200":
          description: The current inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /plugins/rescan:
    post:
      tags: [plugins]
      operationId: rescanPlugins
      summary: Rescan the VST3 directories
      description: |
        Starts one background scan. The response is the inventory as it was when
        the scan started, with `started: true` and `scanning: true` when the
        scan was accepted. A scan already in progress returns `started: false`
        and leaves it running. New, changed and removed bundles are picked up
        when the scan finishes; the scanner's dead-man's-pedal list still keeps
        a crashing bundle from being retried.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: A scan was already running; the inventory is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        "202":
          description: The scan was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: The server has no plug-in inventory attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /midi:
    get:
      tags: [midi]
      operationId: getMidi
      summary: List MIDI inputs and controller roles
      description: |
        Returns the MIDI inputs JUCE can see with the user's enable switch and
        the role the engine gives each one. Any non-Launchpad input is a
        keyboard by default and plays the armed slot. An input can be switched
        to the `grid` role to drive the 8x8 pad grid through a note base or a
        64-pad learn. Only the Launchpad Mini MK3 on its **MI** port reports
        LED output. `padTest` reports the most recent grid test.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current MIDI devices and controllers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MidiState"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /midi/inputs:
    post:
      tags: [control]
      operationId: updateMidiInput
      summary: Enable, disable or configure one MIDI input
      description: |
        Opens or closes one input and changes its role or generic pad mapping.
        The Launchpad row is owned by its driver: enabling it connects the
        controller to the MI port, disabling it disconnects, and it cannot take
        the generic grid role. Every other input is opened by the control
        engine. `role` is `keyboard` (plays the armed slot) or `grid` (drives
        the pad grid). A grid maps notes either from `noteBase` (note base +
        pad index, bottom-left first) or from a completed `learn` of 64 pads.
        The response is the complete MIDI state after the change.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MidiInputUpdate"
            examples:
              enableKeyboard:
                value: { id: "ALSA:5:0", enabled: true }
              useAsGrid:
                value: { id: "ALSA:2:0", role: "grid", noteBase: 36 }
              learnPads:
                value: { id: "ALSA:2:0", learn: true }
      responses:
        "200":
          description: MIDI state after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MidiState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No MIDI input has that identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The server has no MIDI backend attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /midi/pad-test:
    post:
      tags: [control]
      operationId: runMidiPadTest
      summary: Light the Launchpad grid
      description: |
        Lights every pad and walks a bright column across the 8x8 grid for about
        900 ms, then clears the surface and repaints the real grid. Requires a
        connected Launchpad or a scripted LED sink; otherwise the request fails
        with `409` and the reason. The response is the MIDI state with
        `padTest.active: true` and `lit: 64` while the animation runs.
      security:
        - tokenHeader: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: The pad test started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MidiState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: No Launchpad output is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The server has no pad-test handler attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    tokenHeader:
      type: apiKey
      in: header
      name: X-Instrument-Hub-Token
      description: Pairing token in a custom header. Auth is only enforced when the server has a token configured.
    bearerAuth:
      type: http
      scheme: bearer
      description: "The same pairing token as an `Authorization: Bearer` header."

  responses:
    BadRequest:
      description: The request body is missing, malformed or outside the allowed ranges
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "bpm must be between 20 and 300"
    Unauthorized:
      description: A token is required and the supplied token is missing or wrong
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "unauthorized"

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Human-readable reason for the rejection.

    Application:
      type: object
      required: [name, version]
      additionalProperties: false
      properties:
        name:
          type: string
          example: Instrument Hub
        version:
          type: string
          example: 0.1.0

    Slot:
      type: object
      required: [index, name, armed, latencySamples, latencyMs]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based fixed audio-graph slot index.
        name:
          type: string
          description: Display name; defaults to "Slot N".
        armed:
          type: boolean
          description: True for the slot that keys and MIDI currently drive.
        latencySamples:
          type: integer
          minimum: 0
          description: Instrument + FX latency of this slot's chain, in samples.
        latencyMs:
          type: number
          minimum: 0.0
          description: The same chain latency in milliseconds at the engine sample rate.
        editorOpen:
          type: boolean
          description: True while this slot's native plugin editor window is open.
        warmState:
          type: string
          enum: [cold, warming, warm, active, fading]
          description: Warm-pool state of the slot.
        error:
          type: string
          description: The slot-local plugin failure, empty when the slot is healthy.

    Settings:
      type: object
      required: [masterGain, inputGain, midiChannel, metronome]
      additionalProperties: false
      properties:
        masterGain:
          type: number
          minimum: 0.0
          maximum: 1.5
          default: 0.8
          description: Linear gain applied to the master bus.
        inputGain:
          type: number
          minimum: 0.0
          maximum: 2.0
          default: 1.0
          description: Linear gain applied to the live audio-input instrument.
        midiChannel:
          type: integer
          minimum: 1
          maximum: 16
          default: 1
          description: MIDI channel the engine listens on (1-based).
        metronome:
          type: boolean
          default: false
          description: Whether the built-in click is audible.

    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        masterGain:
          type: number
          minimum: 0.0
          maximum: 1.5
        inputGain:
          type: number
          minimum: 0.0
          maximum: 2.0
        midiChannel:
          type: integer
          minimum: 1
          maximum: 16
        metronome:
          type: boolean

    Transport:
      type: object
      required: [playing, bpm, ppq, positionSamples]
      additionalProperties: false
      properties:
        playing:
          type: boolean
        bpm:
          type: number
          minimum: 20.0
          maximum: 300.0
          default: 120.0
        ppq:
          type: number
          minimum: 0.0
          description: Quarter notes elapsed since the transport was last rewound.
        positionSamples:
          type: integer
          minimum: 0
          description: Absolute transport position in engine sample frames.

    TransportPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        playing:
          type: boolean
        bpm:
          type: number
          minimum: 20.0
          maximum: 300.0
        ppq:
          type: number
          minimum: 0.0
        positionSamples:
          type: integer
          minimum: 0

    ArmRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        slot:
          type: [integer, "null"]
          minimum: -1
          description: Slot to arm. `null` or a negative value disarms.

    PatchInstrument:
      type: object
      required: [id, name, kind]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable instrument id inside the set.
        name:
          type: string
          description: Display name.
        kind:
          type: string
          enum: [empty, init-tone, sampler, plugin, audio-input]
          description: Instrument source described by the patch.
        pluginFormat:
          type: string
          description: Plugin format for a plugin patch (`VST3`).
        pluginId:
          type: string
        pluginName:
          type: string
        pluginManufacturer:
          type: string
        pluginVersion:
          type: string
        samplePath:
          type: string
          description: Kit document for a sampler patch.

    Patch:
      type: object
      required:
        [slot, id, name, family, familyName, instrument, volumeDb, pan, mute,
         solo, colorIndex, warmState, warm, editorOpen, latencySamples,
         latencyMs]
      additionalProperties: false
      properties:
        slot:
          type: integer
          minimum: 0
          description: Fixed audio-graph slot that hosts this patch.
        id:
          type: string
          description: Patch id inside its family.
        name:
          type: string
        family:
          type: string
          description: Family id.
        familyName:
          type: string
        instrument:
          $ref: "#/components/schemas/PatchInstrument"
        volumeDb:
          type: number
          minimum: -60
          maximum: 12
          description: Patch volume in dB (-60 is silence).
        pan:
          type: number
          minimum: -1
          maximum: 1
          description: Stereo balance, -1 left .. +1 right.
        mute:
          type: boolean
          description: Muted patches are silent.
        solo:
          type: boolean
          description: When any patch is soloed, the others are silent.
        colorIndex:
          type: integer
          minimum: 0
          maximum: 15
          description: Resolved palette index (family default or patch override).
        warmState:
          type: string
          enum: [cold, warming, warm, active, fading]
          description: Warm-pool state of the patch.
        warm:
          type: boolean
          description: True when the instrument instance is resident.
        editorOpen:
          type: boolean
          description: True while the patch's native plugin editor window is open.
        error:
          type: string
          description: The slot-local plugin failure, empty when the patch is healthy.
        latencySamples:
          type: integer
          minimum: 0
          description: Instrument + FX latency of this patch's chain, in samples.
        latencyMs:
          type: number
          minimum: 0
          description: The same chain latency in milliseconds.

    PluginPage:
      type: object
      required: [id, status, slots, activeSlot, error]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Page id, for example `tracks`.
        status:
          type: string
          enum: [starting, ready, recovering, failed, stopped]
          description: Shared plugin-host status for the page.
        slots:
          type: array
          description: Slots hosted by the page, in page order.
          items:
            type: integer
            minimum: 0
            maximum: 63
        activeSlot:
          type: integer
          minimum: -1
          description: The slot that was last armed on this page.
        error:
          type: string
          description: Page-level failure or recovery reason, empty when healthy.

    Family:
      type: object
      required: [id, name, patches]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        patches:
          type: array
          items:
            $ref: "#/components/schemas/Patch"

    PatchEditor:
      type: object
      required: [slot, open]
      additionalProperties: false
      properties:
        slot:
          type: integer
          minimum: 0
          description: Fixed audio-graph slot that hosts this patch.
        open:
          type: boolean
          description: True when the patch's native editor window is open.
        reused:
          type: boolean
          description: POST only. True when an already-open window was focused.
        wasOpen:
          type: boolean
          description: State before the request was applied.

    PatchStateCapture:
      type: object
      required: [slot, captured, sizeBytes]
      additionalProperties: false
      properties:
        slot:
          type: integer
          minimum: 0
          description: Fixed audio-graph slot that hosts this patch.
        captured:
          type: boolean
          description: True when the running plug-in's state was written to the patch.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Size of the patch's opaque state blob after the capture.

    PatchUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        volumeDb:
          type: number
          minimum: -60
          maximum: 12
        pan:
          type: number
          minimum: -1
          maximum: 1
        mute:
          type: boolean
        solo:
          type: boolean
        colorIndex:
          type: integer
          minimum: 0
          maximum: 15

    PatchSourceRequest:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [empty, init-tone, sampler, plugin, audio-input]
          description: |
            Source to instantiate. `plugin` and `sampler` require `path`;
            `audio-input` ignores both.
        name:
          type: string
          maxLength: 120
          description: Display name for the source; the patch name is unchanged.
        path:
          type: string
          description: Kit document for `sampler`, VST3 bundle for `plugin`.
        frequency:
          type: number
          minimum: 20
          maximum: 20000
          description: Tone frequency for `init-tone`; omitted keeps the current one.
        inputChannel:
          type: integer
          minimum: 0
          maximum: 63
          description: Interface channel for `audio-input`.
        pluginFormat:
          type: string
          description: Plugin format label, `VST3` by default.
        pluginId:
          type: string
          description: Stable plug-in id used by the set document.
        pluginName:
          type: string
        pluginManufacturer:
          type: string
        pluginVersion:
          type: string
        samplePath:
          type: string
          description: Kit document published in the descriptor; defaults to `path`.

    FxInsert:
      type: object
      required:
        [index, type, kind, id, name, bypassed, wet, dry, latencySamples,
         parameters]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
          description: Position in the chain; 0 is the first insert.
        type:
          type: string
          enum: [eq, compressor, delay, reverb, vst3]
          description: Stable effect type.
        kind:
          type: string
          enum: [builtin, vst3]
        id:
          type: string
          description: Built-in id, or the plugin's bundle path.
        name:
          type: string
        bypassed:
          type: boolean
          description: A bypassed insert is skipped and no longer delays the path.
        wet:
          type: number
          minimum: 0
          maximum: 1
          description: Wet/dry balance; 0 is fully dry and bit-exact.
        dry:
          type: number
          minimum: 0
          maximum: 1
          description: The complement of `wet`.
        latencySamples:
          type: integer
          minimum: 0
          description: Latency this insert contributes while it is audible.
        parameters:
          type: object
          additionalProperties:
            type: number
          description: |
            Effect-specific values. Built-ins use these keys:

            - `eq`: `lowFrequencyHz`, `lowGainDb`, `lowQ`, `lowEnabled`,
              `midFrequencyHz`, `midGainDb`, `midQ`, `midEnabled`,
              `highFrequencyHz`, `highGainDb`, `highQ`, `highEnabled`
            - `compressor`: `thresholdDb`, `ratio`, `attackMs`, `releaseMs`,
              `makeupDb`
            - `delay`: `tempoSync` (0/1), `division` (0..9), `timeMs`,
              `feedback`, `dampingHz`
            - `reverb`: `roomSize`, `damping`, `width`, `preDelayMs`
            - `vst3`: parameter id or display name -> normalised 0..1 value

    FxChain:
      type: object
      required:
        [slot, instrumentLatencySamples, fxLatencySamples, latencySamples,
         latencyMs, inserts]
      additionalProperties: false
      properties:
        slot:
          type: integer
          minimum: 0
          description: Fixed audio-graph slot that hosts this patch.
        instrumentLatencySamples:
          type: integer
          minimum: 0
          description: Latency of the instrument source alone.
        fxLatencySamples:
          type: integer
          minimum: 0
          description: Summed latency of the inserts in the audible path.
        latencySamples:
          type: integer
          minimum: 0
          description: Instrument + FX latency of the whole patch.
        latencyMs:
          type: number
          minimum: 0
          description: The same total at the engine's sample rate.
        inserts:
          type: array
          items:
            $ref: "#/components/schemas/FxInsert"

    FxInsertRequest:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [eq, compressor, delay, reverb, vst3]
        path:
          type: string
          description: VST3 bundle path; required for `vst3`, ignored otherwise.
        id:
          type: string
          description: Optional stable id; the bundle path is used for a plugin.
        name:
          type: string
        bypassed:
          type: boolean
          default: false
        wet:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        position:
          type: integer
          minimum: -1
          description: New insert position; -1 or omitted appends.
        parameters:
          type: object
          additionalProperties:
            type: number

    FxInsertUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        bypassed:
          type: boolean
        wet:
          type: number
          minimum: 0
          maximum: 1
        position:
          type: integer
          minimum: 0
          description: Move the insert to this position in the chain.
        parameters:
          type: object
          additionalProperties:
            type: number

    FxChainReplace:
      type: object
      required: [chain]
      additionalProperties: false
      properties:
        chain:
          type: array
          description: The complete new chain, first insert first.
          items:
            $ref: "#/components/schemas/FxInsertRequest"

    FxReorderRequest:
      type: object
      required: [order]
      additionalProperties: false
      properties:
        order:
          type: array
          description: A permutation of 0 .. chainLength-1; first entry first.
          items:
            type: integer
            minimum: 0

    State:
      type: object
      required:
        [schemaVersion, revision, application, armedSlot, uptimeMs, slots,
         families, settings, transport]
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic control-state revision.
        application:
          $ref: "#/components/schemas/Application"
        layout:
          type: string
          enum: [families, tracks]
          description: The session layout; legacy projects use families, new projects use tracks.
        armedSlot:
          type: integer
          minimum: -1
          description: Armed slot index, or -1 when disarmed.
        uptimeMs:
          type: number
          description: Milliseconds since the API state was created.
        slots:
          type: array
          items:
            $ref: "#/components/schemas/Slot"
        tracks:
          type: array
          description: |
            The eight performance tracks when `layout` is `tracks`. Legacy
            family projects omit the field so their v1 state is unchanged.
          minItems: 8
          maxItems: 8
          items:
            $ref: "#/components/schemas/Track"
        pages:
          type: array
          description: Shared plugin-host pages, empty for the legacy family layout.
          items:
            $ref: "#/components/schemas/PluginPage"
        families:
          type: array
          description: Family -> patch tree, one entry per patch.
          items:
            $ref: "#/components/schemas/Family"
        settings:
          $ref: "#/components/schemas/Settings"
        transport:
          $ref: "#/components/schemas/Transport"
        project:
          $ref: "#/components/schemas/ProjectState"

    Track:
      type: object
      required:
        [index, id, name, slot, selected, instrument, volumeStep, volumeDb,
         gain, hotFx]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 7
          description: Zero-based track index.
        id:
          type: string
          description: Stable track id from the set mapping.
        name:
          type: string
        slot:
          type: integer
          minimum: 0
          description: Fixed audio-graph slot that hosts this track.
        selected:
          type: boolean
          description: True for the armed track, which is the only audible one.
        instrument:
          $ref: "#/components/schemas/PatchInstrument"
        volumeStep:
          type: integer
          minimum: 0
          maximum: 4
          description: |
            Stepped volume: 0 silent, 1 50%, 2 75%, 3 100% (0 dB),
            4 +3 dB.
        volumeDb:
          type: number
          minimum: -60
          maximum: 12
          description: The published gain in dB; step 0 reports -60.
        gain:
          type: number
          minimum: 0
          maximum: 2
          description: Linear slot gain for the current step.
        hotFx:
          type: array
          minItems: 2
          maxItems: 2
          description: The two hot-FX slots for this track.
          items:
            $ref: "#/components/schemas/TrackHotFx"

    TrackUpdate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed display name for the track.

    TrackHotFx:
      type: object
      required: [index, id, name, bypassed]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 1
        id:
          type: string
          description: Insert id from the mapping assignment, empty when unassigned.
        name:
          type: string
          description: Insert name from the live chain, empty when unassigned.
        bypassed:
          type: boolean
          description: The insert's current bypass state.

    TrackFxAssignRequest:
      type: object
      required: [insertId]
      additionalProperties: false
      properties:
        insertId:
          type: string
          description: Insert id from the live chain; an empty string clears the slot.

    TrackVolumeRequest:
      type: object
      required: [step]
      additionalProperties: false
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 4
          description: |
            Volume step. 0 is silent, 1 is 50% (-6.0 dB), 2 is 75%
            (-2.5 dB), 3 is 100% (0 dB) and 4 is +3 dB.

    ProjectState:
      type: object
      required: [path, name, dirty, saved, error]
      additionalProperties: false
      properties:
        path:
          type: string
          description: Absolute path of the open `.ihub` project.
        name:
          type: string
          description: Project name, derived from the file name.
        dirty:
          type: boolean
          description: An accepted edit is waiting for the debounced write.
        saved:
          type: boolean
          description: |
            The last project write succeeded. A read-only or unwritable
            project keeps running with `saved: false`.
        error:
          type: string
          description: The last save error, empty when the last write succeeded.

    ProjectEntry:
      type: object
      required: [path, name]
      additionalProperties: false
      properties:
        path:
          type: string
          description: Absolute path of a recent `.ihub` project.
        name:
          type: string
          description: Project name derived from the file name.

    ProjectOverview:
      type: object
      required: [path, name, dirty, saved, error, recent]
      additionalProperties: false
      properties:
        path:
          type: string
          description: Absolute path of the open `.ihub` project, empty when closed.
        name:
          type: string
          description: Project name, derived from the file name.
        dirty:
          type: boolean
          description: An accepted edit is waiting for the debounced write.
        saved:
          type: boolean
          description: The last project write succeeded.
        error:
          type: string
          description: The last save or lifecycle error, empty on success.
        recent:
          type: array
          description: Recently opened projects, newest first.
          items:
            $ref: "#/components/schemas/ProjectEntry"

    ProjectCommand:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [new, open, save, save-as, close]
          description: The lifecycle action to perform.
        path:
          type: string
          description: |
            Absolute path for `open` and `save-as`; optional for `new`,
            which chooses the next untitled path when omitted.
        name:
          type: string
          description: Optional display name for `new`.

    AudioChannel:
      type: object
      required: [index, name, active]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based channel index inside the device.
        name:
          type: string
          description: Device channel label, e.g. "channel 1".
        active:
          type: boolean
          description: Whether the channel is part of the engine's active mapping.

    AudioDevice:
      type: object
      required: [type, name]
      additionalProperties: false
      properties:
        type:
          type: string
          example: ALSA
        name:
          type: string
          example: Steinberg UR22mkII
        description:
          type: string
          description: A short human-readable description of the device.
        available:
          type: boolean
          description: Whether the device could be opened during enumeration.
        reason:
          type: string
          description: Why an unavailable device cannot be opened.

    AudioLatency:
      type: object
      required: [bufferMs, deviceMs, chainMs, totalMs]
      additionalProperties: false
      properties:
        bufferMs:
          type: number
          minimum: 0
          description: One device buffer, in milliseconds.
        deviceMs:
          type: number
          minimum: 0
          description: Input + output latency JUCE reports for the open device.
        chainMs:
          type: number
          minimum: 0
          description: Summed instrument + FX latency of the longest slot chain.
        totalMs:
          type: number
          minimum: 0
          description: bufferMs + deviceMs + chainMs.

    AudioRestore:
      type: object
      required: [usedStoredDevice, fallback, reason]
      additionalProperties: false
      properties:
        usedStoredDevice:
          type: boolean
          description: Whether the launch used the device stored in settings.json.
        fallback:
          type: boolean
          description: Whether the stored device was missing or could not be opened.
        reason:
          type: string
          description: Human-readable explanation when fallback is true.

    AudioState:
      type: object
      required:
        [open, deviceType, deviceName, deviceTypes, devices, sampleRate,
         bufferSize, sampleRates, bufferSizes, inputChannels, outputChannels,
         latency, restore, profiles, xruns, deviceXruns, callbackOverruns,
         callbacks, loadPercent]
      additionalProperties: false
      properties:
        open:
          type: boolean
          description: Whether an audio device is currently streaming.
        deviceType:
          type: string
        deviceName:
          type: string
        deviceTypes:
          type: array
          items:
            type: string
        devices:
          type: array
          items:
            $ref: "#/components/schemas/AudioDevice"
        rawDevices:
          type: array
          description: Every raw ALSA PCM behind the Advanced toggle.
          items:
            $ref: "#/components/schemas/AudioDevice"
        sampleRate:
          type: number
          minimum: 0
        bufferSize:
          type: integer
          minimum: 0
        sampleRates:
          type: array
          items:
            type: number
        bufferSizes:
          type: array
          items:
            type: integer
        inputChannels:
          type: array
          items:
            $ref: "#/components/schemas/AudioChannel"
        outputChannels:
          type: array
          items:
            $ref: "#/components/schemas/AudioChannel"
        latency:
          $ref: "#/components/schemas/AudioLatency"
        restore:
          $ref: "#/components/schemas/AudioRestore"
        profiles:
          type: array
          description: Saved wizard profiles, one per soundcard.
          items:
            $ref: "#/components/schemas/AudioProfile"
        xruns:
          type: integer
          minimum: 0
          description: Total xruns (device driver + callback overruns).
        deviceXruns:
          type: integer
          minimum: 0
        callbackOverruns:
          type: integer
          minimum: 0
        callbacks:
          type: integer
          minimum: 0
        loadPercent:
          type: number
          minimum: 0

    AudioPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        deviceType:
          type: string
        deviceName:
          type: string
        sampleRate:
          type: number
          minimum: 8000
          maximum: 384000
        bufferSize:
          type: integer
          minimum: 16
          maximum: 8192
        inputChannels:
          type: array
          description: Channel indices to activate on the input side.
          items:
            type: integer
            minimum: 0
            maximum: 63
          uniqueItems: true
        outputChannels:
          type: array
          description: Channel indices to activate on the output side.
          items:
            type: integer
            minimum: 0
            maximum: 63
          uniqueItems: true

    AudioProfile:
      type: object
      required:
        [soundcardKey, deviceType, deviceName, sampleRate, bufferSize,
         inputChannels, outputChannels, profile, latencyMs, measuredMs, xruns]
      additionalProperties: false
      properties:
        soundcardKey:
          type: string
          description: Normalised interface name shared by its ALSA and JACK devices.
        deviceType:
          type: string
        deviceName:
          type: string
        sampleRate:
          type: number
          minimum: 0
        bufferSize:
          type: integer
          minimum: 0
        inputChannels:
          type: array
          items:
            type: integer
        outputChannels:
          type: array
          items:
            type: integer
        profile:
          type: string
          description: "`pro-audio` for JACK/Pro devices, otherwise `standard`."
        latencyMs:
          type: number
          minimum: 0
        measuredMs:
          type: number
          minimum: 0
        xruns:
          type: integer
          minimum: 0

    AudioProbe:
      type: object
      required:
        [sampleRate, bufferSize, latencyMs, measuredMs, expectedMs, xruns,
         opened, stable, recommended, error]
      additionalProperties: false
      properties:
        sampleRate:
          type: number
          minimum: 0
        bufferSize:
          type: integer
          minimum: 0
        latencyMs:
          type: number
          minimum: 0
          description: Buffer + device + chain latency budget for this setting.
        measuredMs:
          type: number
          minimum: 0
          description: Measured device round trip when the loopback is connected.
        expectedMs:
          type: number
          minimum: 0
        xruns:
          type: integer
          minimum: 0
        opened:
          type: boolean
        stable:
          type: boolean
        recommended:
          type: boolean
        error:
          type: string

    AudioWizard:
      type: object
      required:
        [valid, error, deviceType, deviceName, soundcard, profile, sampleRate,
         bufferSize, inputChannels, outputChannels, latencyMs, measuredMs,
         expectedMs, xruns, candidates, tradeoff]
      additionalProperties: false
      properties:
        valid:
          type: boolean
        error:
          type: string
        deviceType:
          type: string
        deviceName:
          type: string
        soundcard:
          type: string
        profile:
          type: string
        sampleRate:
          type: number
          minimum: 0
        bufferSize:
          type: integer
          minimum: 0
        inputChannels:
          type: array
          items:
            type: integer
        outputChannels:
          type: array
          items:
            type: integer
        latencyMs:
          type: number
          minimum: 0
        measuredMs:
          type: number
          minimum: 0
        expectedMs:
          type: number
          minimum: 0
        xruns:
          type: integer
          minimum: 0
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/AudioProbe"
        tradeoff:
          type: string

    AudioMeasurement:
      type: object
      required:
        [valid, roundTripSamples, roundTripMs, expectedMs, confidence,
         sampleRate, bufferSize, error]
      additionalProperties: false
      properties:
        valid:
          type: boolean
        roundTripSamples:
          type: integer
          minimum: 0
        roundTripMs:
          type: number
          minimum: 0
        expectedMs:
          type: number
          minimum: 0
          description: Expected loopback round trip, two buffers.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        sampleRate:
          type: number
          minimum: 0
        bufferSize:
          type: integer
          minimum: 0
        error:
          type: string

    MeterFrame:
      type: object
      required: [type, sequence, timestampMs, master, slots]
      additionalProperties: false
      properties:
        type:
          type: string
          const: meters
        sequence:
          type: integer
          minimum: 1
          description: Monotonic frame number. Gaps mean the client skipped frames.
        timestampMs:
          type: number
          description: Milliseconds since the API state was created.
        master:
          type: object
          required: [peak]
          additionalProperties: false
          properties:
            peak:
              type: number
              minimum: 0.0
              maximum: 1.0
        slots:
          type: array
          items:
            $ref: "#/components/schemas/MeterSlot"

    MeterSlot:
      type: object
      required: [slot, peak, gain, armed]
      additionalProperties: false
      properties:
        slot:
          type: integer
          minimum: 0
        peak:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Peak level of the most recent broadcast window.
        gain:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Crossfade gain published by the slot switcher.
        armed:
          type: boolean

    PairingState:
      type: object
      required:
        [lanEnabled, address, port, code, codeExpiresInMs, payload, pairedClients]
      additionalProperties: false
      properties:
        lanEnabled:
          type: boolean
          description: Whether LAN mode is on. Off by default.
        address:
          type: string
          description: Host/IP advertised in the QR payload.
        port:
          type: integer
          minimum: 1
          maximum: 65535
        code:
          type: string
          description: Six decimal digits, empty when LAN mode is off.
          pattern: "^([0-9]{6})?$"
        codeExpiresInMs:
          type: number
          minimum: 0
          description: Remaining lifetime of the current code.
        payload:
          type: string
          description: URL encoded in the QR code, empty when LAN mode is off.
        pairedClients:
          type: integer
          minimum: 0
          description: Number of clients holding a valid pairing token.

    LanRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean

    PairRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: The six-digit code shown next to the QR code.
          pattern: "^[0-9]{6}$"
        clientName:
          type: string
          description: Optional label shown in the desktop pairing panel.
          maxLength: 120

    PairResponse:
      type: object
      required: [token, pairedClients]
      additionalProperties: false
      properties:
        token:
          type: string
          description: "Send as `X-Instrument-Hub-Token` (or `Authorization: Bearer`)."
        pairedClients:
          type: integer
          minimum: 1

    Plugin:
      type: object
      required:
        [id, name, description, vendor, version, category, isInstrument,
         isEffect, format, path]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable identity that survives a restart.
        name:
          type: string
          example: TestPlugin
        description:
          type: string
          description: Optional descriptive name reported by the plugin.
        vendor:
          type: string
          example: Instrument Hub
        version:
          type: string
          description: Version string as reported by the plugin.
        category:
          type: string
          description: Plugin category, e.g. `Fx` or `Instrument`.
        isInstrument:
          type: boolean
          description: True when the plugin identifies itself as an instrument.
        isEffect:
          type: boolean
          description: True for an effect; the complement of `isInstrument`.
        format:
          type: string
          const: VST3
        path:
          type: string
          description: Bundle path the scanner reported.
          example: /usr/lib/vst3/TestPlugin.vst3

    PluginList:
      type: object
      required:
        [plugins, count, total, search, scanning, scanned, lastScanMs, error]
      additionalProperties: false
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"
        count:
          type: integer
          minimum: 0
          description: Number of plugins after the search filter.
        total:
          type: integer
          minimum: 0
          description: Number of installed plugins before the search filter.
        search:
          type: string
          description: The applied search query, empty when unfiltered.
        scanning:
          type: boolean
          description: True while a background rescan is running.
        scanned:
          type: boolean
          description: True once a cache was loaded or a scan completed.
        lastScanMs:
          type: integer
          minimum: 0
          description: Epoch milliseconds of the last completed scan or cache load.
        error:
          type: string
          description: Last scan error, empty on success.
        started:
          type: boolean
          description: Only on `POST /plugins/rescan`; true when a scan was started.

    MidiInput:
      type: object
      required:
        [id, name, role, port, enabled, open, handshake, leds, noteBase,
         learnedNotes, learnActive, events, lastEvent, error]
      additionalProperties: false
      properties:
        id:
          type: string
          description: JUCE device identifier, stable across resumes.
          example: "ALSA:5:0"
        name:
          type: string
          description: ALSA device name.
          example: "Keystation Mini 32 MK3 USB Audio"
        role:
          type: string
          enum: [launchpad, keyboard, grid]
          description: |
            What the engine uses this input for. `keyboard` plays the armed
            slot, `grid` drives the 8x8 pad grid, and `launchpad` is the
            device-specific programmer-mode protocol.
        port:
          type: string
          description: Short port label (`MI`, `DA`, `USB`), empty when the name has none.
        enabled:
          type: boolean
          description: The user's switch for this input.
        open:
          type: boolean
          description: True while the engine owns the port.
        handshake:
          type: boolean
          description: |
            True once a protocol handshake completed. Only the Launchpad
            reports this, through its programmer-mode echo.
        leds:
          type: boolean
          description: True only when this protocol can drive pad LEDs.
        noteBase:
          type: integer
          minimum: -1
          maximum: 64
          description: |
            First note of a sequential 64-pad map, or -1 when the input uses a
            learned note map instead.
        learnedNotes:
          type: integer
          minimum: 0
          maximum: 64
          description: Number of distinct notes captured by the last learn.
        learnActive:
          type: boolean
          description: True while the engine is capturing pads for this grid.
        events:
          type: integer
          minimum: 0
          description: MIDI messages received since the input was opened.
        lastEvent:
          type: string
          description: A human-readable summary of the last message, empty when none.
        error:
          type: string
          description: |
            A readable reason when the input cannot be used as configured,
            empty when it is usable.

    MidiPadTest:
      type: object
      required: [active, lit, durationMs]
      additionalProperties: false
      properties:
        active:
          type: boolean
          description: True while the grid test animation is running.
        lit:
          type: integer
          minimum: 0
          description: Pads currently lit by the test; 64 while it runs.
        durationMs:
          type: integer
          minimum: 0
          description: Length of the animation in milliseconds.

    MidiState:
      type: object
      required: [inputs, inputCount, padTest, error]
      additionalProperties: false
      properties:
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/MidiInput"
        inputCount:
          type: integer
          minimum: 0
          description: Number of MIDI inputs in this snapshot.
        padTest:
          $ref: "#/components/schemas/MidiPadTest"
        error:
          type: string
          description: Enumeration error, empty on success.

    MidiInputUpdate:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Identifier from `GET /midi`.
        enabled:
          type: boolean
          description: Desired switch state.
        role:
          type: string
          enum: [keyboard, grid]
          description: |
            `keyboard` plays the armed slot. `grid` drives the 8x8 pad grid
            and disables keyboard forwarding for this input.
        noteBase:
          type: integer
          minimum: -1
          maximum: 64
          description: |
            First note of a sequential 64-pad map; -1 clears it. The value is
            rejected unless the input already has the `grid` role.
        learn:
          type: boolean
          description: |
            True starts a 64-pad learn on a grid input. The first 64 distinct
            note-ons are stored in press order as pads 0-63. False cancels a
            partial learn.
